interface:
  display_name: "Ship Linear Release"
  short_description: "Реализует и доставляет текущий Linear milestone"
  default_prompt: "Используй $ship-linear-release: реализуй все незавершённые задачи current Linear milestone; без worker count работай одним worker, workers=N соблюдай точно, workers=auto адаптируй к безопасной capacity; интегрируй rolling cutoffs, выполни общие gates и применимые production acceptance."

policy:
  allow_implicit_invocation: false
