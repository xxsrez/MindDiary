name: Engineering baseline

on:
  pull_request:
  push:
    # Coordinator, claim, train, and feature refs carry orchestration metadata
    # or targeted-check results. Only immutable cutoffs and main run this gate.
    branches:
      - main
      - "codex/release/cutoff/**"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          # Conformance binds accepted deltas to exact historical Git objects.
          fetch-depth: 0
      - name: Use pinned Node baseline
        uses: actions/setup-node@v5
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/mind-diary-site/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Install Chromium system dependencies
        run: npx playwright install-deps chromium
      - name: Run canonical full check
        run: npm run check
      - name: Build and verify separate acceptance artifact
        run: npm --prefix apps/mind-diary-acceptance run build && npm --prefix apps/mind-diary-acceptance run verify
      - name: Install locked Product Site dependencies
        run: npm --prefix apps/mind-diary-site ci
      - name: Lint Product Site source
        run: npm --prefix apps/mind-diary-site run lint
      - name: Audit service and Product Site dependencies
        run: npm audit --audit-level=high && npm --prefix apps/mind-diary-site audit --audit-level=high
      - name: Build and verify the deployable Product Site
        run: npm --prefix apps/mind-diary-site run build && npm run check:product-site-artifact -- --candidate-sha "$GITHUB_SHA"
